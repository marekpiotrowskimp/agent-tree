[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tree"
version = "1.0.0"
description = "Agent z Drzewem Kontekstu – interaktywny REPL z selektorem (DeepSeek) + executorem (Copilot Pro)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
py-modules = ["db", "executor", "initializer", "log", "main", "oc_client", "orchestrator", "repl", "selector", "sysmon_web", "updater", "websearch", "tools", "llm_client", "bridge_client", "direct_client"]

[project.scripts]
agent-tree = "repl:main"
agent-tree-sysmon = "sysmon_web:main"
